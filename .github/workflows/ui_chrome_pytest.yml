name: UI Automation Test for Chrome

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # Install Chrome (kept in sync by the action)
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416

      # Cache webdriver_manager downloads (so ChromeDriver isn't re-downloaded every run)
      - name: Cache WebDriver binaries
        uses: actions/cache@v4
        with:
          path: ~/.wdm
          key: wdm-${{ runner.os }}-chrome
          restore-keys: |
            wdm-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests (Chrome)
        id: run_tests
        env:
          # Not strictly needed for Chrome, but harmless; helpful if you ever use Firefox in this job.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WDM_LOCAL: "1"
        run: |
          mkdir -p reports/html
          pytest \
            --browser chrome \
            -m "not in_progress" \
            --html=reports/html/report.html \
            --junitxml=reports/report.xml

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/html

      - name: Upload XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-report
          path: reports/report.xml
