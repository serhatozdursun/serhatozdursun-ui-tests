[project]
name = "serhatozdursun-ui-tests"
version = "0.1.0"
description = "Selenium UI tests for serhatozdursun.com"
authors = [
    { name = "serhatozdursun", email = "serhat.ozdursun@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.10.0",
    "pytest>=7.3.1",
    "pytest-check>=2.4.1",
    "pytest-html>=4.1.1",
    "webdriver-manager>=4.0.2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
ruff = "^0.15.16"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["pages", "tests", "utils"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
